:root[data-theme="dark"]{--bg:#10171e;--sf:#19232c;--tx:#eef2f5;--mu:#98a6b3;--ln:#2a3640;--ac:#6f8dff;--ac-t:#0b1220;--rest:#2fc3a8}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:40px;line-height:1}
h2{font-size:30px;line-height:1.05}
p{margin:0}.mu{color:var(--mu)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-top:12px}
.card .em{font-size:38px}
.card b{font-size:18px}
.btn{display:block;width:100%;background:var(--ac);color:var(--ac-t);font-weight:700;font-size:18px;padding:16px;border-radius:14px;margin-top:18px}
.ghost{color:var(--ac);font-weight:600;padding:8px 0}
.row{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-top:10px}
.row .em{font-size:30px;width:40px;text-align:center}
.row .in{flex:1;min-width:0}.row small{color:var(--mu);display:block;font-size:13px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:10px;border:1px solid var(--ln);font-size:20px;font-weight:700}
.step span{min-width:44px;text-align:center;font-weight:700}
.x{color:var(--mu);font-size:20px;padding:4px 8px}
.sum{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.lk{display:inline-block;margin-top:4px;font-weight:600;font-size:13px;color:var(--ac)}
#run .lk{color:#fff;font-size:16px;margin-top:10px;text-decoration:underline}
#run{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px);text-align:center}
#run.w{background:#2f5bff}#run.r{background:#0f8f78}#run.d{background:#14202b}
#run .top{display:flex;justify-content:space-between;font-weight:600;opacity:.85}
#run .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#run .big{font-size:36vw;max-font-size:200px;line-height:.9;font-size:min(36vw,190px)}
#run .em{font-size:64px}
#run .nx{opacity:.85;min-height:24px}
.ctr{display:flex;gap:12px}
.ctr button{flex:1;background:rgba(255,255,255,.18);border-radius:14px;padding:16px;font-weight:700;font-size:17px;color:#fff}
.ctr button.main{flex:2;background:#fff;color:#14202b}
.bar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin:10px 0}
.bar i{display:block;height:100%;background:#fff;border-radius:3px;width:0}
.add{display:flex;gap:8px;margin-top:14px}
.add input{flex:1;min-width:0;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx)}
.add button{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:0 16px;font-weight:700}
</style>
</head>
